name: Test, Build & Verify Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript & SQLite FTS5 Index
        run: npm run build

      - name: Run 4-Tier Automated Tests (Unit, 8 Fixtures, Stdio Protocol, Guardrails)
        run: npm test

      - name: Run Golden Dataset Retrieval & Guardrail Evaluation
        run: npm run eval

      - name: Verify npm Tarball Contents (dry-run)
        run: npm pack --dry-run
