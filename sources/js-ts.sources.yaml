collection: js-ts
repository_base: https://github.com/Eunryong/Version-Aware-Setup
libraries:
  nextjs:
    repo: vercel/next.js
    tag_pattern: "^v(13|14|15)\\.\\d+\\.\\d+$"
    tag_selection: latest_patch_per_minor
    include_github_releases: true
    paths:
      - path_glob: "docs/01-app/01-building-your-application/08-upgrading/**"
        doc_type: migration_guide
      - path_glob: "docs/01-app/01-getting-started/01-installation.mdx"
        doc_type: setup_guide

  tailwindcss:
    repo: tailwindlabs/tailwindcss.com
    release_repo: tailwindlabs/tailwindcss
    tag_pattern: "^v(3|4)\\.\\d+\\.\\d+$"
    include_github_releases: true
    paths:
      - path_glob: "src/docs/upgrade-guide.mdx"
        doc_type: migration_guide
      - path_glob: "src/docs/installation/**"
        doc_type: setup_guide

  eslint:
    repo: eslint/eslint
    tag_pattern: "^v(8|9)\\.\\d+\\.\\d+$"
    include_github_releases: true
    paths:
      - path_glob: "docs/src/use/migrate-to-9.0.0.md"
        doc_type: migration_guide
      - path_glob: "docs/src/use/configure/migration-guide.md"
        doc_type: migration_guide
      - path_glob: "docs/src/use/getting-started.md"
        doc_type: setup_guide

  react:
    repo: facebook/react
    tag_pattern: "^v(18|19)\\.\\d+\\.\\d+$"
    include_github_releases: true
    paths:
      - path_glob: "CHANGELOG.md"
        doc_type: release_note

  vite:
    repo: vitejs/vite
    tag_pattern: "^v(4|5|6)\\.\\d+\\.\\d+$"
    include_github_releases: true
    paths:
      - path_glob: "docs/guide/migration.md"
        doc_type: migration_guide
      - path_glob: "docs/guide/index.md"
        doc_type: setup_guide

  typescript:
    repo: microsoft/TypeScript
    tag_pattern: "^v5\\.\\d+\\.\\d+$"
    include_github_releases: true
    paths:
      - path_glob: "README.md"
        doc_type: setup_guide

  node:
    repo: nodejs/node
    tag_pattern: "^v(18|20|22)\\.\\d+\\.\\d+$"
    include_github_releases: true
    paths:
      - path_glob: "doc/api/deprecations.md"
        doc_type: deprecation
